name: Monitor Tehnoskarb

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-telegram-bot

      - name: Run checker
        env:
          BOT_TOKEN:            ${{ secrets.BOT_TOKEN }}
          ALL_PRODUCTS_CHAT_ID: ${{ secrets.ALL_PRODUCTS_CHAT_ID }}
        run: python tehnoskarb_check.py

      - name: Commit state & dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_products.json docs/data.json
          git diff --cached --quiet || git commit -m "chore: update data [skip ci]"
          git push
